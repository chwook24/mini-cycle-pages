<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">MiniCycle period calendar preview</title>
  <desc id="desc">A clean iPhone-style period calendar with period, ovulation, and fertile window markers.</desc>
  <rect width="720" height="1080" rx="52" fill="#fff8fa"/>
  <rect x="72" y="72" width="576" height="936" rx="46" fill="#ffffff" stroke="#eadfe2" stroke-width="3"/>
  <text x="126" y="150" fill="#241f21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700">MiniCycle</text>
  <text x="126" y="196" fill="#6b6266" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">May 2026</text>
  <rect x="126" y="704" width="468" height="148" rx="24" fill="#fff8fa" stroke="#eadfe2" stroke-width="2"/>
  <text x="158" y="760" fill="#241f21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700">Next period in 11 days</text>
  <text x="158" y="806" fill="#6b6266" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">Estimated ovulation and fertile window are shown as reference dates.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#9a8e93" text-anchor="middle">
    <text x="136" y="272">Sun</text><text x="211" y="272">Mon</text><text x="286" y="272">Tue</text><text x="361" y="272">Wed</text><text x="436" y="272">Thu</text><text x="511" y="272">Fri</text><text x="586" y="272">Sat</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#241f21" text-anchor="middle">
    <circle cx="136" cy="342" r="25" fill="#f4d8e1"/><text x="136" y="351">3</text><circle cx="211" cy="342" r="25" fill="#f4d8e1"/><text x="211" y="351">4</text><circle cx="286" cy="342" r="25" fill="#f4d8e1"/><text x="286" y="351">5</text><circle cx="361" cy="342" r="25" fill="#f4d8e1"/><text x="361" y="351">6</text><circle cx="436" cy="342" r="25" fill="#f4d8e1"/><text x="436" y="351">7</text>
    <text x="511" y="351">8</text><text x="586" y="351">9</text><text x="136" y="434">10</text><text x="211" y="434">11</text><circle cx="286" cy="425" r="25" fill="#e4f0f7"/><text x="286" y="434">12</text><circle cx="361" cy="425" r="25" fill="#e4f0f7"/><text x="361" y="434">13</text><circle cx="436" cy="425" r="25" fill="#e4f0f7"/><text x="436" y="434">14</text><path d="M511 400 L536 425 L511 450 L486 425 Z" fill="#6fa9cf"/><text x="511" y="434" fill="#ffffff">15</text><circle cx="586" cy="425" r="25" fill="#e4f0f7"/><text x="586" y="434">16</text>
    <text x="136" y="517">17</text><text x="211" y="517">18</text><text x="286" y="517">19</text><text x="361" y="517">20</text><text x="436" y="517">21</text><text x="511" y="517">22</text><text x="586" y="517">23</text><text x="136" y="600">24</text><text x="211" y="600">25</text><circle cx="286" cy="591" r="25" fill="#f9edf1" stroke="#c85f82" stroke-width="3"/><text x="286" y="600">26</text><circle cx="361" cy="591" r="25" fill="#f9edf1" stroke="#c85f82" stroke-width="3"/><text x="361" y="600">27</text><circle cx="436" cy="591" r="25" fill="#f9edf1" stroke="#c85f82" stroke-width="3"/><text x="436" y="600">28</text><circle cx="511" cy="591" r="25" fill="#f9edf1" stroke="#c85f82" stroke-width="3"/><text x="511" y="600">29</text><circle cx="586" cy="591" r="25" fill="#f9edf1" stroke="#c85f82" stroke-width="3"/><text x="586" y="600">30</text>
  </g>
</svg>
